[project]
name = "claude-skills"
version = "0.1.0"
description = "tldrack plugin: every Claude Code skill on this machine in one inventory, an allow-listed /run, and a skills linker"
requires-python = ">=3.10.1,<4"
readme = "README.md"
dependencies = ["voidcraft-world-bridge>=0.1.4,<0.2"]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
# claude_skills/ lives at the project root (flat layout), not under src/
module-root = ""

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
