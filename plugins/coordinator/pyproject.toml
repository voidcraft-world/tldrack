[project]
name = "coordinator"
version = "0.1.0"
description = "tldrack plugin: audit local Claude Code sessions for unfinished work"
requires-python = ">=3.10.1,<4"
readme = "README.md"
# Empty: this plugin imports nothing from the public core. The dependency rule
# for plugins: owned by plugins/README.md — see the note there.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
# coordinator/ lives at the project root (flat layout), not under src/
module-root = ""

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
