[project]
name = "laya-runtime"
version = "0.1.0"
description = "The venv the laya plugin spawns laya-serve from: torch lives here, never in the bridge's venv"
# laya needs >=3.10; torch's macOS arm64 wheels set the ceiling.
requires-python = ">=3.10,<3.14"
# Pinned exactly: a Laya release can change the wire's extra fields or the
# checkpoint revision, and both reach every stored verdict's meaning.
dependencies = [
    "laya[serve]==0.4.19",
]

[tool.uv]
package = false
