# One type-check standard for every Python project. scripts/typecheck.py runs it, project by
# project, and holds each file to the count in tests/mypy-baseline.json (that script owns why).
[mypy]
# Pinned, so the answer does not change with the interpreter that happens to run mypy. 3.12, not
# the oldest supported 3.10: the stubs of what laya-lab imports (numpy) use 3.12 syntax, and ruff
# (`target-version` in ruff.toml) is what keeps the code itself on 3.10.
python_version = 3.12
ignore_missing_imports = True
show_error_codes = True
