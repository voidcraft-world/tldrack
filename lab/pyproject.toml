[project]
name = "laya-lab"
version = "0.1.0"
description = "Fine-tune, calibrate and evaluate Laya checkpoints for the agent rack's decision surfaces, then register the winners for the laya bridge plugin"
requires-python = ">=3.10,<3.14"
readme = "README.md"
# Pinned exactly, like plugins/laya/runtime: a checkpoint trained here is served there.
dependencies = [
    "laya[serve]==0.4.19",
]

[project.scripts]
laya-lab = "laya_lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
