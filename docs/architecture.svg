<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 832 392" width="832" height="392" role="img" aria-labelledby="t d">
  <title id="t">The tldrack loop</title>
  <desc id="d">Your agents report through hooks to the bridge. The bridge hands each finished turn to Laya. A turn Laya reads as done stays quiet. A turn that needs you reaches you. Your label of that verdict fine-tunes Laya, on your machine.</desc>
  <style>
    .bg { fill: #fbfaf7; stroke: #d9d6cc; }
    .box { fill: #ffffff; stroke: #1c1c1a; stroke-width: 1.5; }
    .quiet { fill: #eef6ee; stroke: #2e8540; stroke-width: 1.5; }
    .you { fill: #fff4dc; stroke: #c77d00; stroke-width: 2; }
    .name { font: 700 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1c1c1a; }
    .sub { font: 400 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3d3c38; }
    .edge { font: 700 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1c1c1a; }
    .lead { font: 700 20px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1c1c1a; }
    .line { font: 400 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3d3c38; }
    .wire { fill: none; stroke: #1c1c1a; stroke-width: 1.75; }
    .wire-you { fill: none; stroke: #c77d00; stroke-width: 2.25; }
    .wire-quiet { fill: none; stroke: #2e8540; stroke-width: 1.75; }
    .head { fill: #1c1c1a; }
    .head-you { fill: #c77d00; }
    .head-quiet { fill: #2e8540; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1c1c1a; stroke: #3a3936; }
      .box { fill: #262624; stroke: #e9e7df; }
      .quiet { fill: #1f2e22; stroke: #5cc271; }
      .you { fill: #3a2c0c; stroke: #f5a623; }
      .name, .edge, .lead { fill: #f4f2ea; }
      .sub, .line { fill: #cfccc2; }
      .wire { stroke: #e9e7df; }
      .wire-you { stroke: #f5a623; }
      .wire-quiet { stroke: #5cc271; }
      .head { fill: #e9e7df; }
      .head-you { fill: #f5a623; }
      .head-quiet { fill: #5cc271; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-you" d="M0 0 10 5 0 10z"/></marker>
    <marker id="aq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-quiet" d="M0 0 10 5 0 10z"/></marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="831" height="391" rx="12"/>

  <!-- Row 1: agents, bridge, Laya -->
  <rect class="box" x="24" y="92" width="148" height="72" rx="8"/>
  <text class="name" x="98" y="123" text-anchor="middle">Your agents</text>
  <text class="sub" x="98" y="146" text-anchor="middle">Claude Code, Codex</text>

  <path class="wire" d="M172 128H246" marker-end="url(#a)"/>
  <text class="edge" x="209" y="118" text-anchor="middle">hooks</text>

  <rect class="box" x="248" y="92" width="148" height="72" rx="8"/>
  <text class="name" x="322" y="123" text-anchor="middle">The bridge</text>
  <text class="sub" x="322" y="146" text-anchor="middle">one local page</text>

  <path class="wire" d="M396 128H470" marker-end="url(#a)"/>
  <text class="edge" x="433" y="118" text-anchor="middle">turn end</text>

  <rect class="box" x="472" y="92" width="148" height="72" rx="8"/>
  <text class="name" x="546" y="123" text-anchor="middle">Laya</text>
  <text class="sub" x="546" y="146" text-anchor="middle">reads it for you</text>

  <!-- The verdict forks -->
  <path class="wire-quiet" d="M620 110C648 110 646 56 674 56" marker-end="url(#aq)"/>
  <rect class="quiet" x="676" y="20" width="132" height="72" rx="8"/>
  <text class="name" x="742" y="51" text-anchor="middle">✅ Done</text>
  <text class="sub" x="742" y="74" text-anchor="middle">nothing to read</text>

  <path class="wire-you" d="M620 146C648 146 646 180 674 180" marker-end="url(#ay)"/>
  <rect class="you" x="676" y="144" width="132" height="72" rx="8"/>
  <text class="name" x="742" y="175" text-anchor="middle">⚠️ You</text>
  <text class="sub" x="742" y="198" text-anchor="middle">only when needed</text>

  <!-- Row 2: the label goes back into the model -->
  <path class="wire" d="M742 216V294" marker-end="url(#a)"/>

  <rect class="box" x="676" y="296" width="132" height="72" rx="8"/>
  <text class="name" x="742" y="327" text-anchor="middle">Your label</text>
  <text class="sub" x="742" y="350" text-anchor="middle">one tap</text>

  <path class="wire" d="M676 332H622" marker-end="url(#a)"/>

  <rect class="box" x="472" y="296" width="148" height="72" rx="8"/>
  <text class="name" x="546" y="327" text-anchor="middle">Fine-tune</text>
  <text class="sub" x="546" y="350" text-anchor="middle">on your machine</text>

  <path class="wire" d="M546 296V166" marker-end="url(#a)"/>
  <text class="edge" x="534" y="236" text-anchor="end">a better Laya</text>

  <!-- What the loop means -->
  <text class="lead" x="24" y="262">Agents work. Laya reads. You answer the ⚠️.</text>
  <text class="line" x="24" y="294">Every verdict you grade trains the next Laya.</text>
  <text class="line" x="24" y="320">The whole loop runs on your machine.</text>
</svg>
